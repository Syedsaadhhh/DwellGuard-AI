<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="480" viewBox="0 0 1280 480" role="img" aria-labelledby="title desc">
  <title id="title">DwellGuard: Keep the dock plan moving</title>
  <desc id="desc">A premium visual showing a late arrival becoming a workable window, an agreed dock plan, and a driver informed.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F7F3EA"/>
      <stop offset="0.58" stop-color="#EEF2EC"/>
      <stop offset="1" stop-color="#E2EBE6"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#172B3A" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect width="1280" height="480" rx="28" fill="url(#bg)"/>
  <circle cx="1180" cy="40" r="190" fill="#FFFFFF" opacity="0.28"/>
  <circle cx="1050" cy="500" r="230" fill="#BFD4C8" opacity="0.22"/>
  <g transform="translate(68 62)">
    <rect width="174" height="34" rx="17" fill="#172B3A"/>
    <circle cx="19" cy="17" r="5" fill="#79B694"/>
    <text x="34" y="22" fill="#FFFFFF" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="700" letter-spacing="2">DWELLGUARD</text>
    <text x="0" y="112" fill="#172B3A" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="54" font-weight="750">
      <tspan x="0" dy="0">The delay happened.</tspan>
      <tspan x="0" dy="64">The plan kept moving.</tspan>
    </text>
    <text x="2" y="260" fill="#52646D" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21">From a changed arrival to one clear next step.</text>
    <line x1="0" y1="320" x2="465" y2="320" stroke="#CBD6D0" stroke-width="2"/>
    <text x="0" y="355" fill="#254B62" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="700" letter-spacing="0.5">KEEP THE DOCK PLAN MOVING</text>
  </g>
  <g transform="translate(664 58)" filter="url(#shadow)">
    <rect width="548" height="364" rx="24" fill="#FFFEFA" stroke="#D8E0DB"/>
    <text x="34" y="48" fill="#607078" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="700" letter-spacing="1.8">ONE CONNECTED RESPONSE</text>
    <line x1="65" y1="91" x2="65" y2="295" stroke="#D4DDD8" stroke-width="3"/>
    <g transform="translate(34 74)">
      <circle cx="31" cy="31" r="25" fill="#F9E9E6" stroke="#D99B92"/>
      <text x="31" y="37" text-anchor="middle" fill="#A63F36" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="800">01</text>
      <text x="82" y="25" fill="#172B3A" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="700">Arrival changes</text>
      <text x="82" y="47" fill="#64747B" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14">The original dock time no longer works.</text>
    </g>
    <g transform="translate(34 146)">
      <circle cx="31" cy="31" r="25" fill="#FBF0DB" stroke="#D5B678"/>
      <text x="31" y="37" text-anchor="middle" fill="#8A561B" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="800">02</text>
      <text x="82" y="25" fill="#172B3A" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="700">The real window becomes clear</text>
      <text x="82" y="47" fill="#64747B" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14">The next move follows what is actually possible.</text>
    </g>
    <g transform="translate(34 218)">
      <circle cx="31" cy="31" r="25" fill="#E7EFF3" stroke="#9AB7C5"/>
      <text x="31" y="37" text-anchor="middle" fill="#254B62" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="800">03</text>
      <text x="82" y="25" fill="#172B3A" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="700">The dock plan adapts</text>
      <text x="82" y="47" fill="#64747B" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14">A revised appointment is coordinated.</text>
    </g>
    <g transform="translate(34 290)">
      <circle cx="31" cy="31" r="25" fill="#E8F1EA" stroke="#8DB59A"/>
      <text x="31" y="37" text-anchor="middle" fill="#24654B" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="800">04</text>
      <text x="82" y="25" fill="#172B3A" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="700">Everyone gets one clear plan</text>
      <text x="82" y="47" fill="#64747B" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14">The loop closes with the driver informed.</text>
    </g>
  </g>
</svg>